<article class="border-b border-base-300 py-4">
  <h3>Incident #{{ id }}</h3>
  <p>Node {{ node }} · Cosine distance {{ distance }}</p>
  <p>{{ timestamp }}</p>
  <button class="btn mt-3" data-action="events-incident-{{ id }}"
          aria-label="Inspect incident #{{ id }}">Inspect incident</button>
</article>
