[package]
name = "sibuna"
description = "Sibuna web firewall and anti-crawler daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
name = "sibuna"
path = "src/lib.rs"

[[bin]]
name = "sibuna"
path = "src/main.rs"

[features]
default = ["sqlite", "console"]
# Persistent storage (SID 0011). Without either backend the daemon is the in-memory
# firewall and depends on no external crate.
sqlite = ["storage", "sibuna-storage/sqlite", "sibuna-console?/sqlite"]
postgres = ["storage", "sibuna-storage/postgres", "sibuna-console?/postgres"]
# Internal: set by `sqlite` and `postgres`; enables the storage wiring.
storage = ["dep:sibuna-storage"]
# The console server (SID 0007): `--console*` options, `sibuna console ...` commands and
# the request-path telemetry. It needs storage; build it with a backend.
console = [
    "storage",
    "dep:sibuna-console",
    "dep:sibuna-console-protocol",
    "dep:sibuna-console-storage",
    "dep:sibuna-json",
    "dep:sibuna-geoip",
]

[dependencies]
sibuna-cidr = { workspace = true }
sibuna-crypto = { workspace = true }
sibuna-encoding = { workspace = true }
sibuna-http = { workspace = true }
sibuna-store = { workspace = true }
sibuna-core = { workspace = true }
sibuna-policy = { workspace = true }
sibuna-challenge = { workspace = true }
sibuna-net = { workspace = true }
sibuna-pow = { workspace = true }
sibuna-storage = { workspace = true, optional = true }
sibuna-console = { workspace = true, optional = true }
sibuna-console-protocol = { workspace = true, optional = true }
sibuna-console-storage = { workspace = true, optional = true }
sibuna-json = { workspace = true, optional = true }

# build.rs decodes the GeoIP snapshot it embeds with the console (SIBUNA_GEOIP_DATA).
[build-dependencies]
sibuna-geoip = { workspace = true, optional = true }

[lints]
workspace = true
