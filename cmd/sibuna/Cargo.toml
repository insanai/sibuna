[package]
name = "sibuna"
description = "Sibuna web firewall and anti-crawler daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
name = "sibuna"
path = "src/lib.rs"

[[bin]]
name = "sibuna"
path = "src/main.rs"

[features]
default = ["sqlite", "console", "jlv", "https"]
https = ["dep:sibuna-ingress"]
jlv = ["dep:sibuna-jlv"]
# Persistent storage (SID 0011). Without either backend the daemon is the in-memory
# firewall and depends on no external crate.
sqlite = ["storage", "sibuna-storage/sqlite", "sibuna-console?/sqlite"]
postgres = ["storage", "sibuna-storage/postgres", "sibuna-console?/postgres"]
# TLS for the PostgreSQL connections (`sslmode=verify-full&sslrootcert=...` in the URL).
# Without it a URL whose `sslmode` needs TLS is refused at startup; production clusters
# build with it.
postgres-tls = ["postgres", "sibuna-storage/postgres-tls"]
# Internal: set by `sqlite` and `postgres`; enables the storage wiring.
storage = ["dep:sibuna-storage"]
# The console server (SID 0007): `--console*` options, `sibuna console ...` commands and
# the request-path telemetry. It needs storage; build it with a backend.
console = [
    "storage",
    "dep:sibuna-console",
    "dep:sibuna-console-protocol",
    "dep:sibuna-console-storage",
    "dep:sibuna-json",
    "dep:sibuna-geoip",
]

[dependencies]
sibuna-ingress = { workspace = true, optional = true }
sibuna-cidr = { workspace = true }
sibuna-crypto = { workspace = true }
sibuna-encoding = { workspace = true }
sibuna-http = { workspace = true }
sibuna-store = { workspace = true }
sibuna-core = { workspace = true }
sibuna-policy = { workspace = true }
sibuna-challenge = { workspace = true }
sibuna-lb = { workspace = true }
sibuna-jlv = { workspace = true, optional = true }
sibuna-net = { workspace = true }
sibuna-reactor = { workspace = true }
sibuna-pow = { workspace = true }
sibuna-storage = { workspace = true, optional = true }
sibuna-console = { workspace = true, optional = true }
sibuna-console-protocol = { workspace = true, optional = true }
sibuna-console-storage = { workspace = true, optional = true }
sibuna-json = { workspace = true, optional = true }

# build.rs decodes the GeoIP snapshot it embeds with the console (SIBUNA_GEOIP_DATA).
[build-dependencies]
sibuna-geoip = { workspace = true, optional = true }

[lints]
workspace = true

# The gRPC test drives the binary with an HTTP/2 client over TLS. These crates are
# already in the build through sibuna-ingress; no test needs a crate of its own.
[dev-dependencies]
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http2"] }
hyper-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
