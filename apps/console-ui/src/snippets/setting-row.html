<form id="settings-thresholds" class="flex flex-wrap items-end gap-2 mt-2" data-submit="settings-thresholds">
    <input type="hidden" name="key" value="{{ key }}">
    <label class="grow">{{ key }} (revision {{ revision }})
    <input name="value" class="input input-bordered w-full" inputmode="numeric" value="{{ value }}"></label>
    <button class="btn btn-sm" type="submit"{{ busy }}>Save</button></form>
