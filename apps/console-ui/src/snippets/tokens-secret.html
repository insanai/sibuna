<section class="sb-panel" aria-label="New API token">
    <h2>Token {{ id }} created</h2>
    <p>Save this value privately now. It cannot be retrieved again.
        If you lose it, revoke this token and create another.</p>
    <label for="tokens-secret">One-time token value</label>
    <textarea id="tokens-secret" class="textarea textarea-bordered w-full" rows="2"
        readonly spellcheck="false" autocomplete="off">{{ token }}</textarea>
    <button class="btn btn-primary" data-action="tokens-dismiss">I have saved the token</button>
</section>
