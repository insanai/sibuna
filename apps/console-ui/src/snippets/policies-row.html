<article class="border-b border-base-300 py-4 break-words">
  <h2 class="font-bold">{{ index }}. {{ name }} <span class="badge">{{ action }}</span></h2>
  <p>Path: {{ path }}</p>
  <p>User agent: {{ user_agent }}</p>
  <p>{{ headers }} header matchers · {{ cidrs }} address matchers</p>
  <p>Algorithm: {{ algorithm }} · WEIGH score: {{ weight }}</p>
