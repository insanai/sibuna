<section class="sb-panel" aria-label="Temporary account password">
    <h2>Temporary password for {{ username }}</h2>
    <p>Copy this password now and deliver it privately. It cannot be retrieved again.
        A password change is required at sign-in. Expires {{ expires }}.</p>
    <label for="users-temporary">Temporary password</label>
    <textarea id="users-temporary" class="textarea textarea-bordered w-full" rows="2"
        readonly spellcheck="false" autocomplete="off">{{ password }}</textarea>
    <button class="btn btn-primary" data-action="users-dismiss">I have saved the password</button>
</section>
