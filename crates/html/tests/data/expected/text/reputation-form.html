<form id="reputation-edit" class="sb-settings-form mt-4"><h3>Add or update a prefix</h3>
    <label for="reputation-prefix">Address or CIDR</label>
    <input id="reputation-prefix" name="prefix" class="input input-bordered font-mono" maxlength="48" required value="&lt;prefix a=&#39;1&#39; &amp; &quot;b&quot;&gt;"&lt;busy a=&#39;1&#39; &amp; &quot;b&quot;&gt;>
    <label for="reputation-action">Action</label>
    <select id="reputation-action" name="action" class="select select-bordered"&lt;busy a=&#39;1&#39; &amp; &quot;b&quot;&gt;>
        <option value="deny"&lt;deny a=&#39;1&#39; &amp; &quot;b&quot;&gt;>Deny</option><option value="allow"&lt;allow a=&#39;1&#39; &amp; &quot;b&quot;&gt;>Allow</option></select>
    <label for="reputation-hours">Duration in hours (blank keeps it until removed)</label>
    <input id="reputation-hours" name="hours" class="input input-bordered" inputmode="numeric" maxlength="5"&lt;busy a=&#39;1&#39; &amp; &quot;b&quot;&gt;>
    <label for="reputation-note">Note</label>
    <input id="reputation-note" name="note" class="input input-bordered" maxlength="128"&lt;busy a=&#39;1&#39; &amp; &quot;b&quot;&gt;>
    <div class="flex flex-wrap gap-2 mt-3">
    <button class="btn btn-primary" type="submit"&lt;busy a=&#39;1&#39; &amp; &quot;b&quot;&gt;>Save prefix</button>
