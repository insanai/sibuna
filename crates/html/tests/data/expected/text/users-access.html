<form class="sb-settings-form" id="users-access" data-change="users-draft">
    <fieldset&lt;busy a=&#39;1&#39; &amp; &quot;b&quot;&gt;>
        <legend>Role and enabled state</legend>
        <label for="users-role">Role</label>
        <select id="users-role" class="select select-bordered" name="role">
            <option value="viewer"&lt;viewer a=&#39;1&#39; &amp; &quot;b&quot;&gt;>viewer</option>
            <option value="operator"&lt;operator a=&#39;1&#39; &amp; &quot;b&quot;&gt;>operator</option>
            <option value="admin"&lt;admin a=&#39;1&#39; &amp; &quot;b&quot;&gt;>admin</option>
        </select>
        <label><input class="checkbox checkbox-sm" type="checkbox"
            id="users-disabled" name="disabled"&lt;disabled a=&#39;1&#39; &amp; &quot;b&quot;&gt;>
            Disable this account</label>
        <label><input class="checkbox checkbox-sm" type="checkbox"
            id="users-access-confirmed" name="confirmed"
            required&lt;confirmed a=&#39;1&#39; &amp; &quot;b&quot;&gt;> I reviewed these access changes
            and session revocation.</label>
        <button class="btn btn-primary" type="submit">Save account access</button>
    </fieldset>
</form>
