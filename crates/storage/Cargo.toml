[package]
name = "sibuna-storage"
description = "Sibuna persistent layer over SQLite or PostgreSQL through sqlx (SID 0011)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite-bundled"]
postgres = ["sqlx/postgres"]
# TLS for PostgreSQL connections (`sslmode`, `sslrootcert`): sqlx's rustls client with ring
# and the system trust store, the crates sibuna-tls already brings (SID 0012). Without it a
# URL whose `sslmode` needs TLS is refused at startup.
postgres-tls = ["postgres", "sqlx/tls-rustls-ring-native-roots"]
# Exports `testing::for_each_backend` for the console's storage tests (SID 0013).
testing = []

[dependencies]
sibuna-core = { workspace = true }
sibuna-store = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The tests embed payloads with the Zig embedding, which hashes trigrams with Wyhash.
sibuna-crypto = { workspace = true }
# A test checks that the stored action, algorithm and mode names parse in the policy crate.
sibuna-policy = { workspace = true }

[lints]
workspace = true
