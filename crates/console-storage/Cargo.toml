[package]
name = "sibuna-console-storage"
description = "Sibuna console storage: typed tables and transactional invariants over sqlx (SID 0013)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["sqlite"]
sqlite = ["sibuna-storage/sqlite"]
postgres = ["sibuna-storage/postgres"]

[dependencies]
sibuna-storage = { workspace = true }
sibuna-console-protocol = { workspace = true }
sibuna-crypto = { workspace = true }
# Audit summaries are JSON objects: written with its writer, read back with its parser.
sibuna-json = { workspace = true }
# The protocol carries the User-Agent digest of a session as hex.
sibuna-encoding = { workspace = true }
# Policy workflows validate the candidate engine and page templates before they store them.
sibuna-policy = { workspace = true }
# Country actions measure the reputation trie a candidate would hold.
sibuna-cidr = { workspace = true }
# Country actions accept only the ISO 3166-1 codes the GeoIP data uses.
sibuna-geoip = { workspace = true }
# The incident sidecar hook reads the daemon's response states.
sibuna-core = { workspace = true }

[dev-dependencies]
# The daemon's `Config` and incident types, for tests that start a storage thread.
sibuna-core = { workspace = true }
# The test harness: a fresh database per test on every backend (SID 0013).
sibuna-storage = { workspace = true, features = ["testing"] }

[lints]
workspace = true
