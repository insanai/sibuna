{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sibuna.name" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "sibuna.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - {protocol: TCP, port: 8080}
    {{- else }}
    []
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egressTo }}
    - to:
        {{- toYaml .Values.networkPolicy.egressTo | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.upstream.port }}
    {{- else }}
    []
    {{- end }}
{{- end }}
