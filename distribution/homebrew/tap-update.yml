name: Update Sibuna formula
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Published upstream stable tag (empty selects latest)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: update-formula
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Import qualified upstream formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 tools/sync_tap.py --tag "$RELEASE_TAG"
          else
            python3 tools/sync_tap.py
          fi
          if [ -f Formula/sibuna.rb ]; then ruby -c Formula/sibuna.rb; fi
      - name: Commit an updated formula
        run: |
          if [ -f Formula/sibuna.rb ]; then
            git add Formula/sibuna.rb
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  commit -m 'Update Sibuna from its qualified upstream release'
              git push origin HEAD:main
            fi
          fi
