[workspace]
resolver = "3"
members = ["crates/*", "cmd/*", "tools/*"]
exclude = ["vendor/jlv"]
default-members = ["crates/*", "cmd/sibuna", "tools/*"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.100"
license = "LGPL-3.0-or-later"
repository = "https://github.com/insanai/sibuna"
homepage = "https://insanai.github.io/sibuna/"
authors = ["Vikrant Rathore"]

# Workspace crates share these dependency declarations.
[workspace.dependencies]
sibuna-ingress = { path = "crates/ingress", version = "1.0.0-rc.1" }
# SID 0015. Hyper handles HTTP framing and flow control, Quinn and h3 terminate QUIC.
hyper = { version = "1", default-features = false, features = ["http1", "http2", "client", "server"] }
# Hyper's HTTP/2 implementation, already in the build through hyper. It is named so
# that the egress can read why a stream to an HTTP/2 server failed: only a refused
# stream may be sent again when the request is not idempotent (SID 0019).
h2 = { version = "0.4", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

sibuna-acme = { path = "crates/acme", version = "1.0.0-rc.1" }
sibuna-crypto = { path = "crates/crypto", version = "1.0.0-rc.1" }
sibuna-encoding = { path = "crates/encoding", version = "1.0.0-rc.1" }
sibuna-json = { path = "crates/json", version = "1.0.0-rc.1" }
sibuna-pow = { path = "crates/pow", version = "1.0.0-rc.1" }
sibuna-http = { path = "crates/http", version = "1.0.0-rc.1" }
sibuna-patterns = { path = "crates/patterns", version = "1.0.0-rc.1" }
sibuna-cidr = { path = "crates/cidr", version = "1.0.0-rc.1" }
sibuna-store = { path = "crates/store", version = "1.0.0-rc.1" }
sibuna-inflate = { path = "crates/inflate", version = "1.0.0-rc.1" }
sibuna-geoip = { path = "crates/geoip", version = "1.0.0-rc.1" }
sibuna-core = { path = "crates/core", version = "1.0.0-rc.1" }
sibuna-policy = { path = "crates/policy", version = "1.0.0-rc.1" }
sibuna-challenge = { path = "crates/challenge", version = "1.0.0-rc.1" }
sibuna-jlv = { path = "crates/jlv", version = "1.0.0-rc.1" }
sibuna-lb = { path = "crates/lb", version = "1.0.0-rc.1" }
sibuna-net = { path = "crates/net", version = "1.0.0-rc.1" }
sibuna-reactor = { path = "crates/reactor", version = "1.0.0-rc.1" }
sibuna-spill = { path = "crates/spill", version = "1.0.0-rc.1" }
sibuna-upgrade = { path = "crates/upgrade", version = "1.0.0-rc.1" }
sibuna-storage = { path = "crates/storage", version = "1.0.0-rc.1", default-features = false }
sibuna-html = { path = "crates/html", version = "1.0.0-rc.1", default-features = false }
sibuna-console-protocol = { path = "crates/console-protocol", version = "1.0.0-rc.1" }
sibuna-serve = { path = "crates/serve", version = "1.0.0-rc.1" }
sibuna-tls = { path = "crates/tls", version = "1.0.0-rc.1" }
sibuna-console-storage = { path = "crates/console-storage", version = "1.0.0-rc.1", default-features = false }
sibuna-console = { path = "crates/console", version = "1.0.0-rc.1", default-features = false }
# SID 0030. The hook tiers. The WebAssembly interpreter is written in-house: no crate.
sibuna-plugin = { path = "crates/plugin", version = "1.0.0-rc.1" }
sibuna-authority = { path = "crates/authority", version = "1.0.0-rc.1", default-features = false }

# The LGPL JLV kernel runs only while loading an edge configuration (SID 0015).
jlv-compiler = { path = "vendor/jlv/crates/jlv-compiler" }
jlv-core = { path = "vendor/jlv/crates/jlv-core" }
jlv-lang = { path = "vendor/jlv/crates/jlv-lang" }
jlv-stdlib = { path = "vendor/jlv/crates/jlv-stdlib" }

# External crates. Each one is admitted by a design record and confined to one crate.
# sqlx: SQL storage for SQLite (single node) and PostgreSQL (clusters); SID 0011. Used without
# macros or migrations so no database is needed at build time. Only sibuna-storage uses it.
# PostgreSQL TLS is sibuna-storage's `postgres-tls` feature, which enables sqlx's
# `tls-rustls-ring-native-roots`: it reuses the rustls, ring and rustls-native-certs below
# (one rustls version, no new crate beside sibuna-tls). `tls-rustls-ring-webpki` would add
# webpki-roots, native-tls would add OpenSSL, and sqlx 0.9 cannot take a stream that
# sibuna-tls built (PgConnection opens its own socket). SID 0012.
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio"] }
# tokio: the runtime sqlx requires; a current-thread runtime on the storage thread only. SID 0011.
tokio = { version = "1.53", default-features = false, features = ["rt", "time", "sync"] }
# rustls with ring and the system trust store: outbound TLS for the console, confined to
# sibuna-tls, and through sqlx for PostgreSQL under `postgres-tls`; an in-house TLS client was
# rejected as too large and security-critical. SID 0012.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = { version = "0.8.5" }
# ring: ECDSA P-256 key generation and signing for the ACME account key, the certificate
# request and the TLS-ALPN-01 certificate. It is the crypto provider of rustls above, so it
# is in the build already; an in-house P-256 was rejected as security-critical. Only
# sibuna-acme names it. SID 0021.
ring = { version = "0.17.14" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"

# The bundled SQLite's build script passes a plain `-g` for any debug setting, so its C code
# carried full debug information: 13 MB of the 49 MB binary. Our panics and backtraces need
# line tables of Rust code only. (ring adds `-g3` to its C code whatever the profile says.)
# Debug sections are never loaded, so this changes the file's size, not resident memory.
[profile.release.package.libsqlite3-sys]
debug = false

# The two WebAssembly modules are built with `cargo build --target wasm32-unknown-unknown
# --profile wasm -p <crate>`: the browser solver (`sibuna-pow-wasm`) is downloaded by every
# challenged visitor, the console interface (`sibuna-console-ui`) once per operator session,
# and SID 0007 caps the interface at 768 KiB. Panics abort on wasm32-unknown-unknown anyway;
# saying so keeps unwinding out of every dependency.
[profile.wasm]
inherits = "release"
opt-level = "z"
debug = false
strip = true
panic = "abort"

[profile.wasm.package."*"]
opt-level = "z"

# The solver's hashing loops: at "z" the module grows by 12 percent; at 3 it
# is byte-identical to the release build the daemon embeds.
[profile.wasm.package.sibuna-pow]
opt-level = 3

[profile.wasm.package.sibuna-crypto]
opt-level = 3

[profile.bench]
inherits = "release"
debug = true
