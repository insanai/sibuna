[workspace]
resolver = "3"
members = ["crates/*", "cmd/*", "tools/*"]
default-members = ["crates/*", "cmd/sibuna", "tools/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/insanai/sibuna"
authors = ["Vikrant Rathore <vikrant@vyomtech.com>"]

# Every dependency is declared once here. The data plane has no external crates.
[workspace.dependencies]
sibuna-crypto = { path = "crates/crypto", version = "0.2.0" }
sibuna-encoding = { path = "crates/encoding", version = "0.2.0" }
sibuna-json = { path = "crates/json", version = "0.2.0" }
sibuna-pow = { path = "crates/pow", version = "0.2.0" }
sibuna-http = { path = "crates/http", version = "0.2.0" }
sibuna-patterns = { path = "crates/patterns", version = "0.2.0" }
sibuna-cidr = { path = "crates/cidr", version = "0.2.0" }
sibuna-store = { path = "crates/store", version = "0.2.0" }
sibuna-inflate = { path = "crates/inflate", version = "0.2.0" }
sibuna-geoip = { path = "crates/geoip", version = "0.2.0" }
sibuna-core = { path = "crates/core", version = "0.2.0" }
sibuna-policy = { path = "crates/policy", version = "0.2.0" }
sibuna-challenge = { path = "crates/challenge", version = "0.2.0" }
sibuna-net = { path = "crates/net", version = "0.2.0" }
sibuna-storage = { path = "crates/storage", version = "0.2.0", default-features = false }
sibuna-html = { path = "crates/html", version = "0.2.0" }
sibuna-console-protocol = { path = "crates/console-protocol", version = "0.2.0" }
sibuna-serve = { path = "crates/serve", version = "0.2.0" }
sibuna-tls = { path = "crates/tls", version = "0.2.0" }
sibuna-console-storage = { path = "crates/console-storage", version = "0.2.0", default-features = false }
sibuna-console = { path = "crates/console", version = "0.2.0", default-features = false }

# External crates. Each one is admitted by a design record and confined to one crate.
# sqlx: SQL storage for SQLite (single node) and PostgreSQL (clusters); SID 0011. Used without
# macros, migrations or TLS so no database is needed at build time. Only sibuna-storage uses it.
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio"] }
# tokio: the runtime sqlx requires; a current-thread runtime on the storage thread only. SID 0011.
tokio = { version = "1.53", default-features = false, features = ["rt", "time", "sync"] }
# rustls with ring and the system trust store: outbound TLS for the console only, confined to
# sibuna-tls; an in-house TLS client was rejected as too large and security-critical. SID 0012.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = { version = "0.8.5" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"

# The two WebAssembly modules are built with `cargo build --target wasm32-unknown-unknown
# --profile wasm -p <crate>`: the browser solver (`sibuna-pow-wasm`) is downloaded by every
# challenged visitor, the console interface (`sibuna-console-ui`) once per operator session,
# and SID 0007 caps the interface at 768 KiB. Panics abort on wasm32-unknown-unknown anyway;
# saying so keeps unwinding out of every dependency.
[profile.wasm]
inherits = "release"
opt-level = "z"
debug = false
strip = true
panic = "abort"

[profile.wasm.package."*"]
opt-level = "z"

# The solver's hashing loops: at "z" the module grows by 12 percent; at 3 it
# is byte-identical to the release build the daemon embeds.
[profile.wasm.package.sibuna-pow]
opt-level = 3

[profile.wasm.package.sibuna-crypto]
opt-level = 3

# The daemon's build script still builds the solver with `--release`; keep that build
# optimised for size until it moves to the `wasm` profile.
[profile.release.package.sibuna-pow-wasm]
opt-level = "z"
debug = false
strip = true

[profile.bench]
inherits = "release"
debug = true
