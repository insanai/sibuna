# Sibuna 그림에 쓰는 한국어 문구. 표와 키는 en.toml과 같으며, 빠진 키는 영어로 표시합니다.
# "{name}"은 그림이 채워 넣는 값(예: 이 언어의 형식으로 쓴 숫자)입니다.

[number]
decimal = "."
group = ","

[survival]
x-axis = "시행 횟수(기대 시행 횟수의 배수), x"
y-axis = "아직 탐색 중일 확률"
at-mean = "기대 시행 횟수에서도 탐색이\n계속될 확률은 e⁻¹ ≈ {p}입니다."
p95 = "x ≈ {x}까지 탐색의\n95%가 완료됩니다."

[wire-formats]
challenge = "챌린지 식별자"
session = "세션 토큰"
payload = "{n}바이트 페이로드"
tag = "{n}바이트 키 기반 태그"
tag-field = "BLAKE3 태그"
total = "총 {bytes}바이트, URL 안전 base64 {characters}자로 전송"

