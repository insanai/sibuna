p95 = "x ≈ {x} までに\n95% の探索が完了する。"

[wire-formats]
challenge = "チャレンジ識別子"
session = "セッショントークン"
payload = "{n} バイトのペイロード"
tag = "{n} バイトの鍵付きタグ"
