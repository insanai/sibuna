# Sibuna の図で使う日本語の語句。en.toml と同じ構造のファイルで、ここにないキーは英語で描画される。
# "{name}" は図側で埋め込む値（たとえば日本語書式でフォーマットされた数値）。

[number]
decimal = "."
group = ","

[survival]
x-axis = "試行回数 x（期待試行回数を 1 とした倍率）"
y-axis = "探索がまだ続いている確率"
