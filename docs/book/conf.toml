# Configuration file for Guidedog.
#
# The settings use the names of Sphinx's conf.py, written in TOML:
# https://www.sphinx-doc.org/en/master/usage/configuration.html

# -- Project information -----------------------------------------------------

project = "The Sibuna Book"
copyright = "2026, Vikrant Rathore and Sibuna contributors"
author = "Vikrant Rathore, with assistance from Ronak Rathore and Kanak Rathore"
version = "1.0"
release = "1.0.0-beta.2"

# -- General configuration ---------------------------------------------------

extensions = ["sphinx.ext.graphviz"]
numfig = true
templates_path = ["_templates"]
exclude_patterns = ["_build", "Thumbs.db", ".DS_Store"]
language = "en"
# Translation catalogs: the book's own, then the theme's interface words for ar, hi and ko.
locale_dirs = ["locales", "_templates/locales"]
# Literal blocks are messages too, so diagram labels and code comments can be translated;
# a translator copies the code itself unchanged. Image and graphviz alt text (image) and
# raw blocks (raw) are visible text too; a translator changes only the display strings
# of a raw block.
gettext_additional_targets = ["literal-block", "image", "raw"]
source_suffix = [".rst"]
root_doc = "index"

# -- Options for HTML output -------------------------------------------------

html_theme = "guidedog"
html_static_path = ["_static", "../shared/_static"]
# The shared folder sits beside the project, so the build is allowed to read it.
include_roots = ["../shared"]
# Body text: sibuna.css hyphenates and justifies it, and typography.js breaks English
# prose paragraphs with the Knuth-Plass algorithm, as Typst does in the PDF.
html_css_files = ["sibuna.css"]
html_js_files = ["data/typography/linked-list.js", "data/typography/linebreak.js",
                 "data/typography/hypher.js", "data/typography/english.js",
                 "typography.js"]

# -- Options for PDF output (typeset by Typst from _templates/book.typ) --------

pdf_paper_size = "a4"
# Sibuna's admonition boxes; the design is in _templates/sibuna.typ.
pdf_preamble = "_templates/preamble.typ"
