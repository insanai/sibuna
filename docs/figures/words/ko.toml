y-axis = "아직 탐색 중일 확률"
at-mean = "탐색이 기대 시행 횟수를 넘어\n계속될 확률은 e⁻¹ ≈ {p}입니다."
p95 = "x ≈ {x}까지 탐색의\n95%가 끝납니다."

