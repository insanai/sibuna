# Sibuna 그림에 쓰는 한국어 낱말. 표와 키는 en.toml과 같으며, 빠진 키는 영어로 그립니다.
# "{name}"은 그림이 채워 넣는 값(예: 이 언어의 형식으로 쓴 숫자)입니다.

[number]
decimal = "."
group = ","

[survival]
