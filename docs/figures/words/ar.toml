# The words of Sibuna's figures in Arabic (Modern Standard Arabic). The file has the
# shape of en.toml; a key it leaves out is drawn in English. "{name}" marks a value the
# figure fills in, such as a number in the language's own format.

# The Arabic book writes numbers with the digits 0 to 9, a full stop as the decimal mark
# and a comma between digit groups (65,536 and 70.2).
[number]
decimal = "."
group = ","

