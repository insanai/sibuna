[work-asymmetry]
inspect-title = "Inspect first"
inspect-verdict = "the defense pays for every request"
inspect-sender = "Sender"
inspect-arrow = "one cheap request, cheap to send and costly to answer"
inspect-defense = "Defense: parse and copy, scan with regular expressions, ask a shared store"
inspect-sender-work = "the sender's work: one request"
inspect-defense-work = "the defense's work: all of it, on every request"
work-title = "Work first (Sibuna)"
work-verdict = "the sender pays once, then reuses its session"
