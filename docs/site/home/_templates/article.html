{% extends "layout.html" %}
{% block content %}
<article class="editorial gd-article">
  <div class="article-meta"><a href="{{ edition_url }}articles/">{{ _('Articles') }}</a>
    <time dir="ltr" datetime="{{ page.meta.date }}">{{ page.meta.date }}</time>
    {% if outline %}<details class="article-outline">
      <summary id="outline-title">{{ _('On this page') }}</summary>
      <nav aria-labelledby="outline-title">{{ outline }}</nav>
    </details>{% endif %}
  </div>
  {{ body }}
</article>
{% endblock %}
