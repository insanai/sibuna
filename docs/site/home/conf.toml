project = "Sibuna"
templates_path = ["_templates"]
locale_dirs = ["locales"]
source_suffix = [".rst"]
include_roots = ["../../book"]
gettext_compact = false
gettext_additional_targets = ["image", "literal-block"]
exclude_patterns = ["_build", "locales/**"]
html_use_index = false
html_copy_source = false

[html_context]
site_base = "/sibuna/"
site_url = "https://insanai.github.io/sibuna/"
site_languages = [
  {code = "en", prefix = "", gettext = "en", direction = "ltr", label = "English"},
  {code = "zh-Hans", prefix = "zh-hans/", gettext = "zh_CN", direction = "ltr", label = "简体中文"},
  {code = "ko", prefix = "ko/", gettext = "ko", direction = "ltr", label = "한국어"},
  {code = "ja", prefix = "ja/", gettext = "ja", direction = "ltr", label = "日本語"},
  {code = "es", prefix = "es/", gettext = "es", direction = "ltr", label = "Español"},
  {code = "de", prefix = "de/", gettext = "de", direction = "ltr", label = "Deutsch"},
  {code = "hi", prefix = "hi/", gettext = "hi", direction = "ltr", label = "हिन्दी"},
  {code = "ar", prefix = "ar/", gettext = "ar", direction = "rtl", label = "العربية"},
]
