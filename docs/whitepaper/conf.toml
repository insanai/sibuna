# Configuration file for Guidedog.
#
# The settings use the names of Sphinx's conf.py, written in TOML:
# https://www.sphinx-doc.org/en/master/usage/configuration.html

# -- Project information -----------------------------------------------------

project = "Sibuna: Architecture, Algorithms, and Empirical Foundations of Work-Bound Web Defense"
copyright = "2026, Vikrant Rathore and Sibuna contributors"
author = "Vikrant Rathore"
version = "1.0.0-beta.1"
release = "1.0.0-beta.1"
# The date on the title block and in the running header.
today = "October 2026"

# -- General configuration ---------------------------------------------------

extensions = ["sphinx.ext.graphviz"]
numfig = true
templates_path = ["_templates"]
exclude_patterns = ["_build", "Thumbs.db", ".DS_Store"]
language = "en"
source_suffix = [".rst"]
root_doc = "index"

# -- Options for HTML output -------------------------------------------------

html_theme = "guidedog"
html_title = "Sibuna Whitepaper"

# -- Options for PDF output (typeset by Typst from _templates/book.typ) --------

pdf_paper_size = "a4"
# The whitepaper's boxes and abstract panel; the design is in _templates/whitepaper.typ.
pdf_preamble = "_templates/preamble.typ"

[[pdf_documents]]
root = "index"
file = "sibuna-whitepaper.pdf"
title = "Sibuna: Architecture, Algorithms, and Empirical Foundations of Work-Bound Web Defense"
author = "Vikrant Rathore"
