# Configuration file for Guidedog.
#
# The settings use the names of Sphinx's conf.py, written in TOML:
# https://www.sphinx-doc.org/en/master/usage/configuration.html

# -- Project information -----------------------------------------------------

project = "Sibuna: Architecture, Algorithms, and Empirical Foundations of Work-Bound Web Defense"
copyright = "2026, Vikrant Rathore and Sibuna contributors"
author = "Vikrant Rathore"
version = "1.0.0-beta.2"
release = "1.0.0-beta.2"
# The date on the title block and in the running header.
today = "October 2026"

# -- General configuration ---------------------------------------------------

extensions = ["sphinx.ext.graphviz"]
numfig = true
templates_path = ["_templates"]
exclude_patterns = ["_build", "Thumbs.db", ".DS_Store"]
language = "en"
# Translation catalogs: the whitepaper's own, then the book's catalogs of guidedog's
# interface words for ar, hi and ko, which guidedog lacks (read in place, not copied).
locale_dirs = ["locales", "../book/_templates/locales"]
# Literal blocks are messages too, so diagram labels and code comments can be translated;
# a translator copies the code itself unchanged. Graphviz alt text (image) and the raw
# Typst block of the metric cards (raw) are visible text too; a translator changes only
# the display strings of a raw block.
gettext_additional_targets = ["literal-block", "image", "raw"]
source_suffix = [".rst"]
root_doc = "index"

# -- Options for HTML output -------------------------------------------------

html_theme = "guidedog"
html_static_path = ["_static"]
# Body text: sibuna.css hyphenates and justifies it, and typography.js breaks English
# prose paragraphs with the Knuth-Plass algorithm, as Typst does in the PDF. The
# book and the whitepaper keep identical copies of these files in their _static.
html_css_files = ["sibuna.css"]
html_js_files = ["data/typography/linked-list.js", "data/typography/linebreak.js",
                 "data/typography/hypher.js", "data/typography/english.js",
                 "typography.js"]
html_title = "Sibuna Whitepaper"

# -- Options for PDF output (typeset by Typst from _templates/book.typ) --------

pdf_paper_size = "a4"
# The whitepaper's boxes and abstract panel; the design is in _templates/whitepaper.typ.
pdf_preamble = "_templates/preamble.typ"

# The PDF's title and author are project and author, so a translated build's -D project
# (the title from the language's catalog) reaches the PDF too.
[[pdf_documents]]
root = "index"
file = "sibuna-whitepaper.pdf"
