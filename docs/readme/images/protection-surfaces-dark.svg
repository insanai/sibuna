<title id="diagram-title">How Sibuna protects a request</title><desc id="diagram-description">Shield checks requests for web attacks; Gate skips those checks. Both apply access rules, sessions and request limits. A request can reach the app, receive a puzzle or be stopped.</desc><g id="graph0" class="graph" transform="scale(2.22222 2.22222) rotate(0) translate(21.6 871.45)">
