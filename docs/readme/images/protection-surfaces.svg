<title>mode</title>
<polygon fill="#fff4cc" stroke="#475569" stroke-width="1.6" points="305.8,-746.2 181.8,-690.2 305.8,-634.2 429.8,-690.2 305.8,-746.2" />
<text text-anchor="middle" x="305.8" y="-695.6" font-family="Arial" font-size="17.00" fill="#172033">Check for</text>
<text text-anchor="middle" x="305.8" y="-676.6" font-family="Arial" font-size="17.00" fill="#172033">web attacks?</text>
</g>

<g id="edge1" class="edge">
<title>request-&gt;mode</title>
<path fill="none" stroke="#475569" stroke-width="1.5" d="M305.8,-777.13C305.8,-770.22 305.8,-762.39 305.8,-754.35" />
<polygon fill="#475569" stroke="#475569" stroke-width="1.5" points="308.6,-754.27 305.8,-746.27 303,-754.27 308.6,-754.27" />
</g>

<g id="node3" class="node">
<title>scan</title>
<polygon fill="#eff3f8" stroke="#475569" stroke-width="1.6" points="460.8,-587.2 150.8,-587.2 150.8,-531.2 460.8,-531.2 460.8,-587.2" />
<text text-anchor="middle" x="305.8" y="-564.6" font-family="Arial" font-size="17.00" fill="#172033">Look for SQL injection, XSS,</text>
<text text-anchor="middle" x="305.8" y="-545.6" font-family="Arial" font-size="17.00" fill="#172033">path traversal and command injection</text>
</g>

