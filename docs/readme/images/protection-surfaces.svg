<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="880pt" height="905pt" viewBox="0.00 0.00 880.00 904.72" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">How Sibuna protects a request</title><desc id="diagram-description">Shield checks requests for web attacks; Gate skips those checks. Both apply access rules, sessions and request limits. A request can reach the app, receive a puzzle or be stopped.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 883.12)">
<title>ProtectionSurfaces</title>
<polygon fill="#ffffff" stroke="transparent" points="-21.6,21.6 -21.6,-883.12 858.4,-883.12 858.4,21.6 -21.6,21.6" />
<text text-anchor="middle" x="418.4" y="-839.92" font-family="Arial" font-size="22.00" fill="#172033">How Sibuna protects a request</text>

<g id="node1" class="node">
<title>request</title>
<ellipse fill="#eff3f8" stroke="#475569" stroke-width="1.6" cx="305.8" cy="-803.36" rx="141.34" ry="26.33" />
<text text-anchor="middle" x="305.8" y="-799.26" font-family="Arial" font-size="17.00" fill="#172033">Visitor requests a page</text>
</g>

