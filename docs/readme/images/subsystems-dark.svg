<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="591pt" height="481pt" viewBox="0.00 0.00 591.00 481.00" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Inside Sibuna</title><desc id="diagram-description">Eight groups of crates handle connections, HTTP, proofs, puzzles, access rules, request limits, storage in SQLite or PostgreSQL, and the operator console.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(18 463)">
<title>Subsystems</title>
<polygon fill="#0f172a" stroke="transparent" points="-18,18 -18,-463 573,-463 573,18 -18,18" />

<g id="node1" class="node">
<title>modules</title>
<polygon fill="#0f172a" stroke="transparent" points="0,0 0,-445 555,-445 555,0 0,0" />
<polygon fill="#1e293b" stroke="transparent" points="1.5,-376.5 1.5,-443.5 554.5,-443.5 554.5,-376.5 1.5,-376.5" />
<text text-anchor="start" x="170" y="-412.9" font-family="Arial" font-size="17.00" fill="#f1f5f9">                </text>
<text text-anchor="start" x="243" y="-412.9" font-family="Arial" font-weight="bold" font-size="22.00" fill="#f1f5f9">Inside Sibuna</text>
<text text-anchor="start" x="89" y="-394.9" font-family="Arial" font-size="17.00" fill="#f1f5f9">                </text>
<text text-anchor="start" x="162" y="-394.9" font-family="Arial" font-size="15.00" fill="#f1f5f9">One executable; each crate has a job</text>
<text text-anchor="start" x="412" y="-394.9" font-family="Arial" font-size="17.00" fill="#f1f5f9">            </text>
<text text-anchor="start" x="15.5" y="-349.9" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">serve</text>
<text text-anchor="start" x="140.5" y="-348.9" font-family="Arial" font-size="17.00" fill="#f1f5f9">Accept connections and bound how many stay open</text>
<text text-anchor="start" x="15.5" y="-302.9" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">http, net</text>
<text text-anchor="start" x="140.5" y="-301.9" font-family="Arial" font-size="17.00" fill="#f1f5f9">Read HTTP requests and forward allowed traffic</text>
<text text-anchor="start" x="15.5" y="-255.9" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">pow, crypto</text>
<text text-anchor="start" x="140.5" y="-254.9" font-family="Arial" font-size="17.00" fill="#f1f5f9">Check proofs of work and sign or verify sessions</text>
<text text-anchor="start" x="15.5" y="-208.9" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">challenge</text>
<text text-anchor="start" x="140.5" y="-207.9" font-family="Arial" font-size="17.00" fill="#f1f5f9">Create puzzles and adjust the required work</text>
<text text-anchor="start" x="15.5" y="-161.9" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">policy</text>
<text text-anchor="start" x="140.5" y="-160.9" font-family="Arial" font-size="17.00" fill="#f1f5f9">Apply access rules and look for attacks</text>
<text text-anchor="start" x="15.5" y="-114.9" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">store</text>
<text text-anchor="start" x="140.5" y="-113.9" font-family="Arial" font-size="17.00" fill="#f1f5f9">Track request limits, bans and already-used proofs</text>
<text text-anchor="start" x="15.5" y="-67.9" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">storage</text>
<text text-anchor="start" x="140.5" y="-66.9" font-family="Arial" font-size="17.00" fill="#f1f5f9">Save policies and incidents in SQLite or PostgreSQL</text>
<text text-anchor="start" x="15.5" y="-20.9" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">console</text>
<text text-anchor="start" x="140.5" y="-19.9" font-family="Arial" font-size="17.00" fill="#f1f5f9">Show traffic and help you manage protection</text>
<polygon fill="#94a3b8" stroke="#94a3b8" points="0.5,-376.5 0.5,-376.5 555.5,-376.5 555.5,-376.5 0.5,-376.5" />
