<text xml:space="preserve" text-anchor="start" x="144.12" y="-414.1" font-family="Arial" font-size="17.00" fill="#f1f5f9">                </text>
<text xml:space="preserve" text-anchor="start" x="216.12" y="-414.1" font-family="Arial" font-weight="bold" font-size="22.00" fill="#f1f5f9">Inside Sibuna</text>
<text xml:space="preserve" text-anchor="start" x="56" y="-396.85" font-family="Arial" font-size="17.00" fill="#f1f5f9">                </text>
<text xml:space="preserve" text-anchor="start" x="128" y="-396.85" font-family="Arial" font-size="15.00" fill="#f1f5f9">One executable; each module has a job</text>
<text xml:space="preserve" text-anchor="start" x="392.75" y="-396.85" font-family="Arial" font-size="17.00" fill="#f1f5f9">            </text>
<text xml:space="preserve" text-anchor="start" x="15" y="-351.85" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">socket</text>
<text xml:space="preserve" text-anchor="start" x="122.5" y="-351.25" font-family="Arial" font-size="17.00" fill="#f1f5f9">Open and close network connections safely</text>
<text xml:space="preserve" text-anchor="start" x="15" y="-304.35" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">net</text>
<text xml:space="preserve" text-anchor="start" x="122.5" y="-303.75" font-family="Arial" font-size="17.00" fill="#f1f5f9">Read HTTP requests and forward allowed traffic</text>
<text xml:space="preserve" text-anchor="start" x="15" y="-256.85" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">crypto</text>
<text xml:space="preserve" text-anchor="start" x="122.5" y="-256.25" font-family="Arial" font-size="17.00" fill="#f1f5f9">Compute proofs and sign or verify sessions</text>
<text xml:space="preserve" text-anchor="start" x="15" y="-209.35" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">challenge</text>
<text xml:space="preserve" text-anchor="start" x="122.5" y="-208.75" font-family="Arial" font-size="17.00" fill="#f1f5f9">Create puzzles and adjust the required work</text>
<text xml:space="preserve" text-anchor="start" x="15" y="-161.85" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">policy</text>
<text xml:space="preserve" text-anchor="start" x="122.5" y="-161.25" font-family="Arial" font-size="17.00" fill="#f1f5f9">Apply access rules and look for attacks</text>
<text xml:space="preserve" text-anchor="start" x="15" y="-114.35" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">store</text>
<text xml:space="preserve" text-anchor="start" x="122.5" y="-113.75" font-family="Arial" font-size="17.00" fill="#f1f5f9">Track request limits and already-used proofs</text>
<text xml:space="preserve" text-anchor="start" x="15" y="-66.85" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">edge</text>
<text xml:space="preserve" text-anchor="start" x="122.5" y="-66.25" font-family="Arial" font-size="17.00" fill="#f1f5f9">Save security data and share it between nodes</text>
<text xml:space="preserve" text-anchor="start" x="15" y="-19.35" font-family="Arial" font-weight="bold" font-size="17.00" fill="#f1f5f9">console</text>
<text xml:space="preserve" text-anchor="start" x="122.5" y="-18.75" font-family="Arial" font-size="17.00" fill="#f1f5f9">Show traffic and help you manage protection</text>
