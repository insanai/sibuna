<title id="diagram-title">Inside Sibuna</title><desc id="diagram-description">Eight modules handle connections, HTTP, proofs, puzzles, access rules, request limits, storage and the operator console.</desc><g id="graph0" class="graph" transform="scale(2.22222 2.22222) rotate(0) translate(18 467)">
