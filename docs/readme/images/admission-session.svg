<polygon fill="#fff4cc" stroke="#475569" stroke-width="1.6" points="302.8,-234.2 152.8,-178.2 302.8,-122.2 452.8,-178.2 302.8,-234.2" />
<text text-anchor="middle" x="302.8" y="-183.6" font-family="Arial" font-size="17.00" fill="#172033">Can this request</text>
<text text-anchor="middle" x="302.8" y="-164.6" font-family="Arial" font-size="17.00" fill="#172033">reach your app?</text>
</g>

<g id="edge7" class="edge">
<title>checks-&gt;result</title>
<path fill="none" stroke="#475569" stroke-width="1.5" d="M302.8,-260.97C302.8,-255.3 302.8,-249.09 302.8,-242.71" />
