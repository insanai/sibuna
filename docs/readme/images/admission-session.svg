<text xml:space="preserve" text-anchor="middle" x="300.95" y="-701.04" font-family="Arial" font-size="17.00" fill="#172033">Browser solves the puzzle</text>
<text xml:space="preserve" text-anchor="middle" x="300.95" y="-681.54" font-family="Arial" font-size="17.00" fill="#172033">in the background</text>
</g>

<g id="edge1" class="edge">
<title>challenge-&gt;work</title>
<path fill="none" stroke="#475569" stroke-width="1.5" d="M300.95,-752.21C300.95,-747.1 300.95,-741.88 300.95,-736.79" />
<polygon fill="#475569" stroke="#475569" stroke-width="1.5" points="303.75,-736.89 300.95,-728.89 298.15,-736.89 303.75,-736.89" />
</g>

