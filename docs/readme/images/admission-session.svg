<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1797pt" height="2020pt" viewBox="0.00 0.00 1797.00 2020.00" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Solve a puzzle, then keep browsing</title><desc id="diagram-description">The browser solves a puzzle. An accepted solution earns a signed session cookie, which the browser sends on later requests. Rules and request limits still apply, and Shield still checks attacks. Later requests can reach the app, need new work or be stopped.</desc><g id="graph0" class="graph" transform="scale(2.22222 2.22222) rotate(0) translate(21.6 887.52)">
<title>AdmissionSession</title>
<polygon fill="#ffffff" stroke="none" points="-21.6,21.6 -21.6,-887.52 787.01,-887.52 787.01,21.6 -21.6,21.6" />
<text xml:space="preserve" text-anchor="middle" x="382.71" y="-841.02" font-family="Arial" font-size="22.00" fill="#172033">Solve a puzzle, then keep browsing</text>

<g id="node1" class="node">
<title>challenge</title>
<ellipse fill="#eff3f8" stroke="#475569" stroke-width="1.6" cx="300.95" cy="-792.63" rx="148.87" ry="39.8" />
<text xml:space="preserve" text-anchor="middle" x="300.95" y="-795.98" font-family="Arial" font-size="17.00" fill="#172033">Sibuna asks the browser</text>
<text xml:space="preserve" text-anchor="middle" x="300.95" y="-776.48" font-family="Arial" font-size="17.00" fill="#172033">to solve a puzzle</text>
</g>

