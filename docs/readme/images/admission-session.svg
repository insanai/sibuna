<polygon fill="#eff3f8" stroke="#475569" stroke-width="1.6" points="445.8,-317.2 159.8,-317.2 159.8,-261.2 445.8,-261.2 445.8,-317.2" />
<text text-anchor="middle" x="302.8" y="-294.6" font-family="Arial" font-size="17.00" fill="#172033">Check the session, rules and limits</text>
<text text-anchor="middle" x="302.8" y="-275.6" font-family="Arial" font-size="17.00" fill="#172033">Shield also checks for attacks</text>
</g>

<g id="edge6" class="edge">
