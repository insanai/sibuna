<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="815pt" height="903pt" viewBox="0.00 0.00 814.68 902.59" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Solve a puzzle, then keep browsing</title><desc id="diagram-description">The browser solves a puzzle. An accepted solution earns a signed session cookie, which the browser sends on later requests. Rules and request limits still apply, and Shield still checks attacks. Later requests can reach the app, need new work or be stopped.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(21.6 880.99)">
<title>AdmissionSession</title>
<polygon fill="#ffffff" stroke="transparent" points="-21.6,21.6 -21.6,-880.99 793.08,-880.99 793.08,21.6 -21.6,21.6" />
<text text-anchor="middle" x="385.74" y="-837.79" font-family="Arial" font-size="22.00" fill="#172033">Solve a puzzle, then keep browsing</text>

<g id="node1" class="node">
<title>challenge</title>
<ellipse fill="#eff3f8" stroke="#475569" stroke-width="1.6" cx="302.8" cy="-787.79" rx="149.81" ry="39.7" />
<text text-anchor="middle" x="302.8" y="-793.19" font-family="Arial" font-size="17.00" fill="#172033">Sibuna asks the browser</text>
<text text-anchor="middle" x="302.8" y="-774.19" font-family="Arial" font-size="17.00" fill="#172033">to solve a puzzle</text>
</g>

<g id="node2" class="node">
<title>work</title>
<polygon fill="#eff3f8" stroke="#475569" stroke-width="1.6" points="414.3,-721.2 191.3,-721.2 191.3,-665.2 414.3,-665.2 414.3,-721.2" />
<text text-anchor="middle" x="302.8" y="-698.6" font-family="Arial" font-size="17.00" fill="#172033">Browser solves the puzzle</text>
<text text-anchor="middle" x="302.8" y="-679.6" font-family="Arial" font-size="17.00" fill="#172033">in the background</text>
</g>

<g id="edge1" class="edge">
<title>challenge-&gt;work</title>
<path fill="none" stroke="#475569" stroke-width="1.5" d="M302.8,-748.06C302.8,-741.86 302.8,-735.47 302.8,-729.36" />
<polygon fill="#475569" stroke="#475569" stroke-width="1.5" points="305.6,-729.24 302.8,-721.24 300,-729.24 305.6,-729.24" />
</g>

<g id="node3" class="node">
<title>proof</title>
<polygon fill="#fff4cc" stroke="#475569" stroke-width="1.6" points="302.8,-638.2 124.8,-582.2 302.8,-526.2 480.8,-582.2 302.8,-638.2" />
<text text-anchor="middle" x="302.8" y="-587.6" font-family="Arial" font-size="17.00" fill="#172033">Does Sibuna accept</text>
<text text-anchor="middle" x="302.8" y="-568.6" font-family="Arial" font-size="17.00" fill="#172033">the solution?</text>
</g>

<g id="edge2" class="edge">
<title>work-&gt;proof</title>
<path fill="none" stroke="#475569" stroke-width="1.5" d="M302.8,-664.97C302.8,-659.3 302.8,-653.09 302.8,-646.71" />
<polygon fill="#475569" stroke="#475569" stroke-width="1.5" points="305.6,-646.57 302.8,-638.57 300,-646.57 305.6,-646.57" />
</g>

<g id="node4" class="node">
<title>cookie</title>
<polygon fill="#eff3f8" stroke="#475569" stroke-width="1.6" points="405.8,-483.2 199.8,-483.2 199.8,-427.2 405.8,-427.2 405.8,-483.2" />
<text text-anchor="middle" x="302.8" y="-460.6" font-family="Arial" font-size="17.00" fill="#172033">Browser saves a signed</text>
<text text-anchor="middle" x="302.8" y="-441.6" font-family="Arial" font-size="17.00" fill="#172033">session cookie</text>
</g>

<g id="edge3" class="edge">
<title>proof-&gt;cookie</title>
<path fill="none" stroke="#475569" stroke-width="1.5" d="M302.8,-526.01C302.8,-514.34 302.8,-502.34 302.8,-491.64" />
<polygon fill="#475569" stroke="#475569" stroke-width="1.5" points="305.6,-491.37 302.8,-483.37 300,-491.37 305.6,-491.37" />
<text text-anchor="middle" x="315.3" y="-501.2" font-family="Arial" font-size="15.00" fill="#172033">Yes</text>
</g>

<g id="node5" class="node">
<title>invalid</title>
<ellipse fill="#fde8e7" stroke="#475569" stroke-width="1.6" cx="654.8" cy="-582.2" rx="116.85" ry="26.33" />
<text text-anchor="middle" x="654.8" y="-578.1" font-family="Arial" font-size="17.00" fill="#172033">Reject the solution</text>
</g>

<g id="edge4" class="edge">
<title>proof:e-&gt;invalid:w</title>
<path fill="none" stroke="#475569" stroke-width="1.5" d="M480.8,-582.2C480.8,-582.2 500.3,-598.2 500.3,-598.2 500.3,-598.2 519.3,-598.2 519.3,-598.2 519.3,-598.2 525.26,-593.13 530.47,-588.7" />
<polygon fill="#475569" stroke="#475569" stroke-width="1.5" points="533.85,-589.51 538.13,-582.2 530.22,-585.24 533.85,-589.51" />
<text text-anchor="middle" x="509.8" y="-603.2" font-family="Arial" font-size="15.00" fill="#172033">No</text>
</g>

<g id="node6" class="node">
<title>requests</title>
<polygon fill="#eff3f8" stroke="#475569" stroke-width="1.6" points="412.3,-400.2 193.3,-400.2 193.3,-344.2 412.3,-344.2 412.3,-400.2" />
<text text-anchor="middle" x="302.8" y="-377.6" font-family="Arial" font-size="17.00" fill="#172033">On the next request,</text>
<text text-anchor="middle" x="302.8" y="-358.6" font-family="Arial" font-size="17.00" fill="#172033">browser sends the cookie</text>
</g>

<g id="edge5" class="edge">
<title>cookie-&gt;requests</title>
<path fill="none" stroke="#475569" stroke-width="1.5" d="M302.8,-426.77C302.8,-420.9 302.8,-414.62 302.8,-408.51" />
<polygon fill="#475569" stroke="#475569" stroke-width="1.5" points="305.6,-408.32 302.8,-400.32 300,-408.32 305.6,-408.32" />
</g>

